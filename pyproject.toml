[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-ai-engineering-os"
version = "0.1.0"
description = "Personal AI Engineering Assistant and Development Operating System"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = [
    "AI-Engineering-Learning-OS/tests"
]